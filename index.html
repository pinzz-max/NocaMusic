<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crate — Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #17130F;
    --surface: #221C16;
    --surface-2: #2C241C;
    --border: #3B3128;
    --accent: #E8A33D;
    --accent-soft: #4A3A22;
    --text: #F4ECE1;
    --text-muted: #9C8E7C;
    --danger: #C8743A;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html, body{
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  input{
    -webkit-user-select: text;
    user-select: text;
  }
  body{
    font-family:'Inter', sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  /* ---------- Header ---------- */
  header{
    padding:20px 16px 12px;
    border-bottom:1px solid var(--border);
  }
  .brand{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size:28px;
    letter-spacing:0.5px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand span{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:400;
    color:var(--accent);
    letter-spacing:2px;
    text-transform:uppercase;
  }
  .search-row{
    margin-top:14px;
    display:flex;
    gap:8px;
  }
  .search-row input{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    color:var(--text);
    font-size:15px;
    font-family:'Inter', sans-serif;
  }
  .search-row input:focus{
    outline:none;
    border-color:var(--accent);
  }
  .search-row button{
    background:var(--accent);
    color:#1A1410;
    border:none;
    border-radius:8px;
    padding:0 18px;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .search-row button:active{ opacity:0.85; }

  /* ---------- Main content ---------- */
  main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding-bottom:110px; /* leave room for now-playing bar */
  }
  .section-title{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text-muted);
    padding:18px 16px 8px;
  }
  .empty-state{
    padding:40px 16px;
    text-align:center;
    color:var(--text-muted);
    font-size:14px;
    line-height:1.6;
  }

  .track-list{ display:flex; flex-direction:column; }
  .track-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 16px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
  }
  .track-row:active{ background:var(--surface); }
  .track-row img{
    width:52px; height:52px;
    border-radius:6px;
    object-fit:cover;
    flex-shrink:0;
  }
  .track-info{ flex:1; min-width:0; }
  .track-title{
    font-size:14px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-channel{
    font-size:12px;
    color:var(--text-muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:2px;
  }
  .track-actions{
    display:flex;
    gap:6px;
    flex-shrink:0;
  }
  .icon-btn{
    width:34px; height:34px;
    border-radius:50%;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:14px;
    flex-shrink:0;
  }
  .icon-btn:active{ background:var(--accent-soft); }
  .icon-btn.playing{
    background:var(--accent);
    color:#1A1410;
    border-color:var(--accent);
  }

  .queue-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:8px 16px;
    border-bottom:1px solid var(--border);
  }
  .queue-row .qnum{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--text-muted);
    width:20px;
    text-align:right;
    flex-shrink:0;
  }
  .queue-row.active .track-title{ color:var(--accent); }
  .queue-row .remove-btn{
    color:var(--text-muted);
    font-size:18px;
    background:none;
    border:none;
    cursor:pointer;
    padding:6px;
  }

  /* ---------- Now playing bar ---------- */
  .now-playing{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--surface);
    border-top:1px solid var(--border);
    padding:10px 14px 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .np-top{
    display:flex;
    align-items:center;
    gap:12px;
  }
  /* signature element: spinning reel */
  .reel{
    width:42px; height:42px;
    border-radius:50%;
    border:2px solid var(--accent);
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    animation: spin 3s linear infinite;
    animation-play-state: paused;
    background:
      radial-gradient(circle at center, var(--surface-2) 0 6px, transparent 6.5px),
      conic-gradient(var(--border) 0deg 90deg, transparent 90deg 180deg, var(--border) 180deg 270deg, transparent 270deg 360deg);
  }
  .reel.spinning{ animation-play-state: running; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .np-info{ flex:1; min-width:0; }
  .np-title{
    font-size:13px;
    font-weight:500;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .np-channel{
    font-size:11px;
    color:var(--text-muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .np-controls{
    display:flex;
    gap:8px;
    flex-shrink:0;
  }
  .np-controls .icon-btn{ width:38px; height:38px; font-size:16px; }

  .np-progress{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .np-time{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--text-muted);
    flex-shrink:0;
    width:38px;
  }
  .np-bar{
    flex:1;
    height:4px;
    background:var(--border);
    border-radius:2px;
    position:relative;
    cursor:pointer;
  }
  .np-bar-fill{
    position:absolute;
    left:0; top:0; bottom:0;
    background:var(--accent);
    border-radius:2px;
    width:0%;
  }

  #player{ position:absolute; opacity:0; pointer-events:none; width:1px; height:1px; }

  /* ---------- Lyrics panel ---------- */
  .lyrics-panel{
    position:fixed;
    left:0; right:0; bottom:0;
    height:0;
    overflow:hidden;
    background:var(--surface);
    border-top:1px solid var(--border);
    transition:height 0.25s ease;
    z-index:5;
  }
  .lyrics-panel.open{ height:60vh; }
  .lyrics-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px 8px;
    border-bottom:1px solid var(--border);
  }
  .lyrics-header .section-title{ padding:0; }
  .lyrics-close{
    background:none; border:none; color:var(--text-muted);
    font-size:20px; cursor:pointer; padding:4px;
  }
  .lyrics-body{
    height:calc(60vh - 50px);
    overflow-y:auto;
    padding:40px 20px 80px;
    font-family:'Fraunces', serif;
    scroll-behavior: smooth;
  }
  .lyrics-line{
    font-size:22px;
    font-weight:700;
    line-height:1.5;
    color:var(--text-muted);
    padding:6px 0;
    margin-bottom:6px;
    opacity:0.35;
    transform: scale(0.97);
    transform-origin: left center;
    transition: opacity 0.4s ease, transform 0.4s ease, filter 0.4s ease;
    filter: blur(1.5px);
    will-change: opacity, transform, filter;
  }
  .lyrics-line.upcoming{
    opacity: 0.55;
    filter: blur(0.5px);
    transform: scale(0.98);
  }
  .lyrics-line.active{
    opacity: 1;
    filter: blur(0px);
    transform: scale(1.03);
    color: var(--text);
  }
  /* Kata per kata highlight */
  .lyric-word{
    display:inline;
    transition: color 0.12s ease, text-shadow 0.12s ease;
    color: var(--text-muted);
  }
  .lyrics-line.active .lyric-word{
    color: rgba(244,236,225,0.35);
  }
  .lyrics-line.active .lyric-word.word-sung{
    color: var(--text);
  }
  .lyrics-line.active .lyric-word.word-active{
    color: var(--accent);
    text-shadow: 0 0 20px rgba(232,163,61,0.6);
  }

  .tape-label{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--text-muted);
    letter-spacing:1px;
  }
</style>
</head>
<body>

<header>
  <div class="brand">CRATE <span>// audio digger</span></div>
  <div class="search-row">
    <input id="searchInput" type="text" placeholder="Cari lagu atau artis..." />
    <button id="searchBtn">Cari</button>
  </div>
</header>

<main>
  <div class="section-title">Hasil pencarian</div>
  <div id="results" class="track-list">
    <div class="empty-state">Cari lagu untuk mulai mengisi crate kamu.</div>
  </div>

  <div class="section-title">Antrian (queue)</div>
  <div id="queue" class="track-list">
    <div class="empty-state" id="queueEmpty">Belum ada antrian. Tambahkan lagu dari hasil pencarian.</div>
  </div>
</main>

<div class="now-playing">
  <div class="np-top">
    <div class="reel" id="reel"></div>
    <div class="np-info">
      <div class="np-title" id="npTitle">Belum ada lagu diputar</div>
      <div class="np-channel" id="npChannel">—</div>
    </div>
    <div class="np-controls">
      <div class="icon-btn" id="lyricsBtn" title="Lirik"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 3h10M3 6.5h10M3 10h7M3 13h5"/></svg></div>
      <div class="icon-btn" id="prevBtn"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 8 14 2.5v11z"/><path d="M2 8 8 2.5v11z"/></svg></div>
      <div class="icon-btn" id="playPauseBtn"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l10-5.5z"/></svg></div>
      <div class="icon-btn" id="nextBtn"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 8 2 2.5v11z"/><path d="M14 8 8 2.5v11z"/></svg></div>
    </div>
  </div>
  <div class="np-progress">
    <span class="np-time" id="curTime">0:00</span>
    <div class="np-bar" id="npBar"><div class="np-bar-fill" id="npBarFill"></div></div>
    <span class="np-time" id="durTime">0:00</span>
  </div>
  <div class="tape-label">SIDE A · audio-only via YouTube</div>
</div>

<div class="lyrics-panel" id="lyricsPanel">
  <div class="lyrics-header">
    <div class="section-title">Lirik</div>
    <button class="lyrics-close" id="lyricsClose">×</button>
  </div>
  <div class="lyrics-body" id="lyricsBody">
    <div class="empty-state">Putar lagu untuk melihat lirik.</div>
  </div>
</div>

<div id="player"></div>

<script>
/* =========================================================
   KONFIGURASI
   PENTING: API key di bawah ini terlihat oleh siapapun yang
   membuka source halaman ini. Batasi key di Google Cloud
   Console (HTTP referrer + restrict ke YouTube Data API v3)
   sebelum deploy ke publik.
   ========================================================= */
const API_KEY = "AIzaSyC6-nIWdSaJyFiX5r1ss3P6Wz-LU8BJCIs";

/* SVG icons (vector, supaya tidak dirender sebagai emoji warna-warni) */
const ICON_PLAY = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l10-5.5z"/></svg>';
const ICON_PAUSE = '<svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>';
const ICON_ADD = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 2v12M2 8h12"/></svg>';

let queue = [];      // array of {id, title, channel, thumb}
let currentIndex = -1;
let ytPlayer = null;
let playerReady = false;
let progressInterval = null;

/* ---------- YouTube IFrame API ---------- */
const ytScript = document.createElement('script');
ytScript.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(ytScript);

function onYouTubeIframeAPIReady(){
  ytPlayer = new YT.Player('player', {
    height: '1', width: '1',
    playerVars: { autoplay: 0, controls: 0 },
    events: {
      onReady: () => { playerReady = true; },
      onStateChange: onPlayerStateChange
    }
  });
}
window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;

function onPlayerStateChange(e){
  const reel = document.getElementById('reel');
  const playBtn = document.getElementById('playPauseBtn');
  if(e.data === YT.PlayerState.PLAYING){
    reel.classList.add('spinning');
    playBtn.innerHTML = ICON_PAUSE;
    startProgressLoop();
  } else {
    reel.classList.remove('spinning');
    playBtn.innerHTML = ICON_PLAY;
    stopProgressLoop();
  }
  if(e.data === YT.PlayerState.ENDED){
    playNext();
  }
}

/* ---------- Search ---------- */
document.getElementById('searchBtn').addEventListener('click', doSearch);
document.getElementById('searchInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') doSearch();
});

async function doSearch(){
  const q = document.getElementById('searchInput').value.trim();
  if(!q) return;
  const resultsEl = document.getElementById('results');
  resultsEl.innerHTML = `<div class="empty-state">Mencari...</div>`;

  try{
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=15&type=video&videoCategoryId=10&q=${encodeURIComponent(q)}&key=${API_KEY}`;
    const res = await fetch(url);
    const data = await res.json();

    if(data.error){
      resultsEl.innerHTML = `<div class="empty-state">Error: ${data.error.message}</div>`;
      return;
    }

    if(!data.items || data.items.length === 0){
      resultsEl.innerHTML = `<div class="empty-state">Tidak ada hasil.</div>`;
      return;
    }

    resultsEl.innerHTML = '';
    data.items.forEach(item => {
      const track = {
        id: item.id.videoId,
        title: item.snippet.title,
        channel: item.snippet.channelTitle,
        thumb: item.snippet.thumbnails.default.url
      };
      resultsEl.appendChild(renderTrackRow(track));
    });
  } catch(err){
    resultsEl.innerHTML = `<div class="empty-state">Gagal mengambil data: ${err.message}</div>`;
  }
}

function renderTrackRow(track){
  const row = document.createElement('div');
  row.className = 'track-row';
  row.innerHTML = `
    <img src="${track.thumb}" alt="">
    <div class="track-info">
      <div class="track-title">${escapeHtml(track.title)}</div>
      <div class="track-channel">${escapeHtml(track.channel)}</div>
    </div>
    <div class="track-actions">
      <div class="icon-btn" title="Tambah ke antrian">${ICON_ADD}</div>
      <div class="icon-btn" title="Putar sekarang">${ICON_PLAY}</div>
    </div>
  `;
  const [addBtn, playBtn] = row.querySelectorAll('.icon-btn');
  addBtn.addEventListener('click', (e)=>{ e.stopPropagation(); addToQueue(track); });
  playBtn.addEventListener('click', (e)=>{ e.stopPropagation(); playNow(track); });
  return row;
}

/* ---------- Queue ---------- */
function addToQueue(track){
  queue.push(track);
  renderQueue();
  if(currentIndex === -1){
    currentIndex = 0;
    loadTrack(currentIndex);
  }
}

function playNow(track){
  queue.push(track);
  currentIndex = queue.length - 1;
  renderQueue();
  loadTrack(currentIndex);
}

function renderQueue(){
  const queueEl = document.getElementById('queue');
  if(queue.length === 0){
    queueEl.innerHTML = `<div class="empty-state" id="queueEmpty">Belum ada antrian. Tambahkan lagu dari hasil pencarian.</div>`;
    return;
  }
  queueEl.innerHTML = '';
  queue.forEach((track, i) => {
    const row = document.createElement('div');
    row.className = 'queue-row' + (i === currentIndex ? ' active' : '');
    row.innerHTML = `
      <div class="qnum">${i+1}</div>
      <img src="${track.thumb}" alt="" style="width:36px;height:36px;border-radius:4px;object-fit:cover;">
      <div class="track-info">
        <div class="track-title">${escapeHtml(track.title)}</div>
        <div class="track-channel">${escapeHtml(track.channel)}</div>
      </div>
      <button class="remove-btn" title="Hapus">×</button>
    `;
    row.addEventListener('click', (e)=>{
      if(e.target.classList.contains('remove-btn')) return;
      currentIndex = i;
      loadTrack(currentIndex);
    });
    row.querySelector('.remove-btn').addEventListener('click', (e)=>{
      e.stopPropagation();
      removeFromQueue(i);
    });
    queueEl.appendChild(row);
  });
}

function removeFromQueue(i){
  queue.splice(i, 1);
  if(i === currentIndex){
    if(queue.length === 0){
      currentIndex = -1;
      stopProgressLoop();
      if(ytPlayer && playerReady) ytPlayer.stopVideo();
      updateNowPlaying(null);
    } else {
      currentIndex = Math.min(currentIndex, queue.length - 1);
      loadTrack(currentIndex);
    }
  } else if(i < currentIndex){
    currentIndex--;
  }
  renderQueue();
}

/* ---------- Playback ---------- */
function loadTrack(index){
  const track = queue[index];
  if(!track || !playerReady) {
    // Player belum siap, coba lagi sebentar
    if(track && !playerReady) setTimeout(()=>loadTrack(index), 300);
    return;
  }
  ytPlayer.loadVideoById(track.id);
  ytPlayer.playVideo();
  updateNowPlaying(track);
  renderQueue();
  loadLyrics(track);
}

function updateNowPlaying(track){
  if(!track){
    document.getElementById('npTitle').textContent = 'Belum ada lagu diputar';
    document.getElementById('npChannel').textContent = '—';
    document.getElementById('npBarFill').style.width = '0%';
    document.getElementById('curTime').textContent = '0:00';
    document.getElementById('durTime').textContent = '0:00';
    return;
  }
  document.getElementById('npTitle').textContent = track.title;
  document.getElementById('npChannel').textContent = track.channel;
}

document.getElementById('playPauseBtn').addEventListener('click', ()=>{
  if(!playerReady || currentIndex === -1) return;
  const state = ytPlayer.getPlayerState();
  if(state === YT.PlayerState.PLAYING){
    ytPlayer.pauseVideo();
  } else {
    ytPlayer.playVideo();
  }
});

document.getElementById('nextBtn').addEventListener('click', playNext);
document.getElementById('prevBtn').addEventListener('click', playPrev);

function playNext(){
  if(queue.length === 0) return;
  if(currentIndex < queue.length - 1){
    currentIndex++;
    loadTrack(currentIndex);
  } else {
    // habis, hentikan
    stopProgressLoop();
    if(ytPlayer && playerReady) ytPlayer.stopVideo();
  }
}

function playPrev(){
  if(queue.length === 0) return;
  if(currentIndex > 0){
    currentIndex--;
    loadTrack(currentIndex);
  }
}

/* ---------- Progress bar (rAF presisi tinggi) ---------- */
let rafId = null;
let lastSyncTime = 0;
let lastSyncAt = 0;
let syncInterval = null;

function startProgressLoop(){
  stopProgressLoop();
  function syncFromPlayer(){
    if(!playerReady) return;
    lastSyncTime = ytPlayer.getCurrentTime() || 0;
    lastSyncAt = performance.now();
  }
  syncFromPlayer();
  syncInterval = setInterval(syncFromPlayer, 500);

  function tick(){
    const elapsed = (performance.now() - lastSyncAt) / 1000;
    const cur = lastSyncTime + elapsed;
    const durSec = (playerReady && ytPlayer) ? (ytPlayer.getDuration() || 0) : 0;
    document.getElementById('curTime').textContent = formatTime(cur);
    document.getElementById('durTime').textContent = formatTime(durSec);
    const pct = durSec > 0 ? (cur / durSec) * 100 : 0;
    document.getElementById('npBarFill').style.width = pct + '%';
    updateLyricsHighlight(cur);
    rafId = requestAnimationFrame(tick);
  }
  rafId = requestAnimationFrame(tick);
}

function stopProgressLoop(){
  if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
  if(syncInterval){ clearInterval(syncInterval); syncInterval = null; }
  if(progressInterval){ clearInterval(progressInterval); progressInterval = null; }
}

document.getElementById('npBar').addEventListener('click', (e)=>{
  if(!playerReady || currentIndex === -1) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  const dur = ytPlayer.getDuration() || 0;
  ytPlayer.seekTo(dur * pct, true);
});

/* ---------- Utils ---------- */
function formatTime(sec){
  sec = Math.floor(sec);
  const m = Math.floor(sec/60);
  const s = sec % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ---------- Lirik (lrclib.net - database lirik terbuka, gratis, tanpa API key) ---------- */
let currentLyrics = []; // [{time: seconds, text: string}]

document.getElementById('lyricsBtn').addEventListener('click', ()=>{
  document.getElementById('lyricsPanel').classList.toggle('open');
});
document.getElementById('lyricsClose').addEventListener('click', ()=>{
  document.getElementById('lyricsPanel').classList.remove('open');
});

// Bersihkan embel-embel umum dari judul YouTube
function cleanTitle(str){
  return str
    .replace(/\(.*?\)/g, '')
    .replace(/\[.*?\]/g, '')
    .replace(/official\s*(music\s*)?video/gi, '')
    .replace(/official\s*audio/gi, '')
    .replace(/official\s*lyric\s*video/gi, '')
    .replace(/lyrics?\s*video/gi, '')
    .replace(/lyrics?/gi, '')
    .replace(/\bHD\b|\bHQ\b|\b4K\b|\bMV\b/g, '')
    .replace(/ft\.?|feat\.?/gi, '')
    .replace(/\s{2,}/g, ' ')
    .trim();
}

// Hasilkan beberapa variasi query untuk fallback
function buildQueries(track){
  const channelClean = track.channel
    .replace(/VEVO|Official|Music|Records|Channel|- Topic/gi, '')
    .trim();

  const rawClean = cleanTitle(track.title);
  const parts = rawClean.split(/\s*[-–—]\s*/);

  const queries = [];

  if(parts.length >= 2){
    const artistFromTitle = parts[0].trim();
    const titleFromTitle = parts.slice(1).join(' ').trim();
    // Query 1: artis dari judul + judul lagu
    queries.push({ artist: artistFromTitle, title: titleFromTitle });
    // Query 2: artis dari channel + judul lagu
    if(channelClean && channelClean.toLowerCase() !== artistFromTitle.toLowerCase()){
      queries.push({ artist: channelClean, title: titleFromTitle });
    }
    // Query 3: judul lagu saja (tanpa artis)
    queries.push({ artist: '', title: titleFromTitle });
  } else {
    // Tidak ada separator, pakai channel sebagai artis
    queries.push({ artist: channelClean, title: rawClean });
    queries.push({ artist: '', title: rawClean });
  }

  return queries;
}

async function searchLrclib(artist, title){
  const q = [artist, title].filter(Boolean).join(' ');
  const url = `https://lrclib.net/api/search?q=${encodeURIComponent(q)}`;
  const res = await fetch(url);
  if(!res.ok) return [];
  const data = await res.json();
  return Array.isArray(data) ? data : [];
}

async function loadLyrics(track){
  currentLyrics = [];
  wordTimings = [];
  lastActiveWordKey = null;
  const body = document.getElementById('lyricsBody');
  body.innerHTML = `<div class="empty-state">Mencari lirik...</div>`;

  const queries = buildQueries(track);

  try{
    let data = [];
    for(const q of queries){
      data = await searchLrclib(q.artist, q.title);
      if(data.length > 0) break; // ketemu, stop
    }

    if(data.length === 0){
      body.innerHTML = `<div class="empty-state">Lirik tidak ditemukan untuk lagu ini.</div>`;
      return;
    }

    // Pilih hasil pertama yang punya lirik tersinkron, kalau tidak ada pakai plain lyrics
    const synced = data.find(d => d.syncedLyrics);
    const plain = data.find(d => d.plainLyrics);

    if(synced){
      currentLyrics = parseLRC(synced.syncedLyrics);
      renderLyrics(currentLyrics, true);
    } else if(plain){
      const lines = plain.plainLyrics.split('\n').filter(l => l.trim() !== '');
      renderLyrics(lines, false);
    } else {
      body.innerHTML = `<div class="empty-state">Lirik tidak ditemukan untuk lagu ini.</div>`;
    }
  } catch(err){
    body.innerHTML = `<div class="empty-state">Gagal memuat lirik: ${err.message}</div>`;
  }
}

// Parser format LRC: setiap baris diawali [mm:ss.xx]
function parseLRC(lrcText){
  const lines = lrcText.split('\n');
  const result = [];
  const timeRe = /\[(\d+):(\d+(?:\.\d+)?)\]/;
  lines.forEach(line => {
    const match = line.match(timeRe);
    if(!match) return;
    const minutes = parseInt(match[1], 10);
    const seconds = parseFloat(match[2]);
    const time = minutes * 60 + seconds;
    const text = line.replace(timeRe, '').trim();
    result.push({ time, text: text || '...' });
  });
  return result;
}

// wordTimings: array of { time, lineIndex, wordIndex }
let wordTimings = [];

function buildWordTimings(lyrics){
  wordTimings = [];
  for(let i = 0; i < lyrics.length; i++){
    const line = lyrics[i];
    const nextTime = i + 1 < lyrics.length ? lyrics[i+1].time : line.time + 5;
    const words = line.text.split(/\s+/).filter(w => w.length > 0);
    if(words.length === 0) continue;
    const duration = nextTime - line.time;
    // distribusi waktu per kata proporsional panjang karakter
    const totalChars = words.reduce((s, w) => s + w.length, 0) || 1;
    let t = line.time;
    words.forEach((word, wi) => {
      wordTimings.push({ time: t, lineIndex: i, wordIndex: wi });
      t += (word.length / totalChars) * duration;
    });
  }
}

function renderLyrics(lines, synced){
  const body = document.getElementById('lyricsBody');
  if(lines.length === 0){
    body.innerHTML = `<div class="empty-state">Lirik tidak ditemukan untuk lagu ini.</div>`;
    return;
  }
  body.innerHTML = '';
  lines.forEach((lineObj, i) => {
    const lineText = typeof lineObj === 'string' ? lineObj : (lineObj.text || '');
    const el = document.createElement('div');
    el.className = 'lyrics-line';
    el.dataset.index = i;

    if(synced && lineText && lineText !== '...'){
      // Pecah jadi span per kata
      const parts = lineText.split(/(\s+)/);
      parts.forEach(part => {
        if(/^\s+$/.test(part)){
          el.appendChild(document.createTextNode(part));
        } else {
          const span = document.createElement('span');
          span.className = 'lyric-word';
          span.textContent = part;
          el.appendChild(span);
        }
      });
    } else {
      el.textContent = lineText;
    }

    body.appendChild(el);
  });

  if(synced){
    buildWordTimings(currentLyrics);
    setTimeout(cacheWordSpans, 0); // cache setelah DOM render
  }
  lastActiveLineIndex = -1;
  lastActiveWordIndex = -1;
}

let lastActiveLineIndex = -1;
let lastActiveWordIndex = -1;
// Cache span references per line untuk performa
let lineWordSpansCache = [];

function cacheWordSpans(){
  const body = document.getElementById('lyricsBody');
  lineWordSpansCache = [];
  body.querySelectorAll('.lyrics-line').forEach(line => {
    lineWordSpansCache.push(Array.from(line.querySelectorAll('.lyric-word')));
  });
}

function updateLyricsHighlight(currentTime){
  if(currentLyrics.length === 0) return;

  const body = document.getElementById('lyricsBody');
  const allLines = body.querySelectorAll('.lyrics-line');
  if(allLines.length === 0) return;

  // Cari baris aktif
  let activeLineIndex = -1;
  for(let i = 0; i < currentLyrics.length; i++){
    if(currentLyrics[i].time <= currentTime) activeLineIndex = i;
    else break;
  }

  // Update kelas baris hanya kalau berubah
  if(activeLineIndex !== lastActiveLineIndex){
    allLines.forEach((el, i) => {
      const dist = i - activeLineIndex;
      el.classList.remove('active', 'upcoming');
      if(i === activeLineIndex){
        el.classList.add('active');
        if(document.getElementById('lyricsPanel').classList.contains('open')){
          el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
      } else if(dist === 1 || dist === 2){
        el.classList.add('upcoming');
      }
    });

    // Reset highlight kata di baris lama
    if(lastActiveLineIndex >= 0 && lineWordSpansCache[lastActiveLineIndex]){
      lineWordSpansCache[lastActiveLineIndex].forEach(s => s.classList.remove('word-active','word-sung'));
    }
    lastActiveLineIndex = activeLineIndex;
    lastActiveWordIndex = -1;
  }

  // Highlight per kata (hanya di baris aktif)
  if(wordTimings.length === 0 || activeLineIndex < 0) return;

  let activeWT = null;
  for(let i = 0; i < wordTimings.length; i++){
    if(wordTimings[i].lineIndex === activeLineIndex && wordTimings[i].time <= currentTime){
      activeWT = wordTimings[i];
    } else if(wordTimings[i].lineIndex > activeLineIndex) break;
  }

  const activeWordIndex = activeWT ? activeWT.wordIndex : -1;
  if(activeWordIndex === lastActiveWordIndex) return;
  lastActiveWordIndex = activeWordIndex;

  const spans = lineWordSpansCache[activeLineIndex];
  if(!spans) return;

  spans.forEach((span, wi) => {
    if(wi < activeWordIndex){
      span.classList.add('word-sung');
      span.classList.remove('word-active');
    } else if(wi === activeWordIndex){
      span.classList.add('word-active');
      span.classList.remove('word-sung');
    } else {
      span.classList.remove('word-active','word-sung');
    }
  });
}
